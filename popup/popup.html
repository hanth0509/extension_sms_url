<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spam & Phishing Detector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <span class="brand-name">PhishGuard</span>
      <!-- <span class="brand-version">v1.0</span> -->
    </div>
    <div class="header-actions">
      <button id="btn-dashboard" class="btn-icon" title="Open Full Dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
      </button>
      <!-- <button id="btn-settings" class="btn-icon" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button> -->
    </div>
  </header>

  <!-- ===== OFFLINE BANNER ===== -->
  <div id="offline-banner" class="offline-banner hidden">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 6.74a10.91 10.91 0 0 0-1.86 1.81M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
    </svg>
    No internet connection
  </div>

  <!-- ===== TAB NAV ===== -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="sms">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      SMS Scanner
    </button>
    <button class="tab-btn" data-tab="url">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      URL Scanner
    </button>
    <!-- <button class="tab-btn" data-tab="settings">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
    </button> -->
  </nav>

  <!-- ===== TAB CONTENT ===== -->
  <main class="tab-content">

    <!-- TAB: SMS SCANNER -->
    <section id="tab-sms" class="tab-panel active">
      <div class="panel-body">
        <div class="input-group">
          <label class="input-label" for="sms-input">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            SMS Content
          </label>
          <textarea
            id="sms-input"
            class="text-input"
            placeholder="Paste SMS message here to analyze for spam..."
            rows="5"
            maxlength="2000"
          ></textarea>
          <div class="char-count"><span id="sms-char-count">0</span> / 2000</div>
        </div>

        <div class="btn-row">
          <button id="sms-analyze-btn" class="btn-primary">
            <span class="btn-text">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              Analyze
            </span>
            <span class="btn-spinner hidden">
              <span class="spinner"></span>
              Analyzing...
            </span>
          </button>
          <button id="sms-clear-btn" class="btn-secondary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
            Clear
          </button>
        </div>

        <!-- SMS Result Card -->
        <div id="sms-result" class="result-card hidden"></div>
      </div>
    </section>

    <!-- TAB: URL SCANNER -->
    <section id="tab-url" class="tab-panel hidden">
      <div class="panel-body">
        <div class="input-group">
          <label class="input-label" for="url-input">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            URL to Scan
          </label>
          <input
            id="url-input"
            type="text"
            class="text-input url-input"
            placeholder="https://example.com"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="url-actions-row">
          <button id="url-paste-btn" class="btn-ghost" title="Paste current tab URL">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            </svg>
            Use Current Tab
          </button>
        </div>

        <div class="btn-row">
          <button id="url-analyze-btn" class="btn-primary">
            <span class="btn-text">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              Analyze
            </span>
            <span class="btn-spinner hidden">
              <span class="spinner"></span>
              Analyzing...
            </span>
          </button>
          <button id="url-clear-btn" class="btn-secondary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
            Clear
          </button>
        </div>

        <!-- URL Result Card -->
        <div id="url-result" class="result-card hidden"></div>
      </div>
    </section>

    <!-- TAB: SETTINGS -->
    <section id="tab-settings" class="tab-panel hidden">
      <div class="panel-body">
        <div class="settings-section">
          <h3 class="settings-title">Backend Configuration</h3>

          <div class="input-group">
            <label class="input-label" for="backend-url-input">Backend API URL</label>
            <input
              id="backend-url-input"
              type="text"
              class="text-input"
              placeholder="http://127.0.0.1:8000"
              spellcheck="false"
            />
            <p class="input-hint">FastAPI backend base URL (no trailing slash)</p>
          </div>

          <div class="input-group">
            <label class="input-label" for="dashboard-url-input">Dashboard URL</label>
            <input
              id="dashboard-url-input"
              type="text"
              class="text-input"
              placeholder="http://localhost:3000"
              spellcheck="false"
            />
            <p class="input-hint">Web dashboard URL for full statistics view</p>
          </div>
        </div>

        <div class="settings-actions">
          <button id="save-settings-btn" class="btn-primary full-width">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
            </svg>
            Save Settings
          </button>
          <button id="reset-settings-btn" class="btn-secondary full-width">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.33"/>
            </svg>
            Reset to Default
          </button>
          <button id="open-dashboard-btn" class="btn-accent full-width">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            Open Full Dashboard
          </button>
        </div>

        <div class="settings-info">
          <div class="info-row">
            <span class="info-label">Extension Version</span>
            <span class="info-value" id="ext-version">v1.0.0</span>
          </div>
          <div class="info-row">
            <span class="info-label">Backend Status</span>
            <span class="info-value" id="backend-status">
              <span class="status-dot"></span> Checking...
            </span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== TOAST CONTAINER ===== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="../utils/helpers.js"></script>
  <script src="../services/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
